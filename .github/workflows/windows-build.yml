name: Build Windows exe

on:
  push:
    branches: [3d-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.7.1 + Windows export templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/windows_release_x86_64_console.exe" "templates/windows_debug_x86_64_console.exe" "templates/version.txt" -d ~/.local/share/godot/export_templates/4.7.1.stable/
          rm godot.zip templates.tpz

      - name: Import assets
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --import || true

      - name: Export Windows build
        run: |
          mkdir -p build
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --export-release "Windows Desktop"
          ls -la build/

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Windows build"
          body: "Auto-built from ${{ github.sha }}"
          prerelease: true
          files: build/VoidFront.exe
